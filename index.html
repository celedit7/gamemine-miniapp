<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GameMine Test</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #ffd400;
    }

    .task {
      background: #171b24;
      border: 1px solid #292f3b;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .task-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .task-description {
      color: #9ba3b2;
      font-size: 13px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #ffd400;
      color: #111;
      font-weight: bold;
      font-size: 15px;
    }

    #status {
      color: #9ba3b2;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <h1>GameMine</h1>

  <div id="status">
    Loading tasks...
  </div>

  <div id="tasks"></div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyBOgOmfmySW0Wh9mlQJvKHhAHC9wXz8uk",

      authDomain:
        "gamemine-5d7ee.firebaseapp.com",

      projectId:
        "gamemine-5d7ee",

      storageBucket:
        "gamemine-5d7ee.firebasestorage.app",

      messagingSenderId:
        "524612369793",

      appId:
        "1:524612369793:web:e425affa42cf1cb3e2bc80"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    async function loadTasks() {

      const status =
        document.getElementById("status");

      const container =
        document.getElementById("tasks");


      try {

        const snapshot =
          await getDocs(
            collection(db, "tasks")
          );


        container.innerHTML = "";


        let count = 0;


        snapshot.forEach((docSnap) => {

          const task =
            docSnap.data();


          if (
            task.active === true &&
            Number(task.cycle) === 1
          ) {

            count++;


            const card =
              document.createElement("div");

            card.className =
              "task";


            const title =
              document.createElement("div");

            title.className =
              "task-title";

            title.textContent =
              task.title || "GameMine Task";


            const description =
              document.createElement("div");

            description.className =
              "task-description";

            description.textContent =
              task.description || "";


            const button =
              document.createElement("button");

            button.textContent =
              "START";


            button.addEventListener(
              "click",
              () => {

                alert(
                  "START BUTTON WORKS! 🚀\n\n" +
                  "Task: " +
                  (task.title || "GameMine Task")
                );

              }
            );


            card.appendChild(title);
            card.appendChild(description);
            card.appendChild(button);


            container.appendChild(card);

          }

        });


        if (count === 0) {

          status.textContent =
            "No active tasks found.";

        } else {

          status.textContent =
            count +
            " tasks loaded successfully.";

        }

      }

      catch (error) {

        console.error(error);

        status.innerHTML =
          "❌ Firebase error:<br>" +
          error.message;

      }

    }


    loadTasks();

  </script>

</body>
</html>
